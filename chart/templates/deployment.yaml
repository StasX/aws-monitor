apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deploy
  labels:
    {{- include "exam.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      {{- include "exam.labels" . | nindent 6 }}
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- include "exam.labels" . | nindent 8 }}
    spec:
      {{- if .Values.securityContext.enabled }}
      securityContext:
        {{- omit .Values.securityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ printf "%s:%s" .Values.pod.image .Values.pod.tag | quote }}
          imagePullPolicy: Always

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.pod.targetPort }}

          env:
            - name: AUTH_TRUSTED_PROXY_CIDRS
              value: {{ join "," .Values.dashboard.trustedProxyCidrs | quote }}
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ required "mongodb.existingSecret is required" .Values.mongodb.existingSecret }}
                  key: MONGODB_URI
            - name: MONGODB_DATABASE
              value: {{ .Values.mongodb.database | quote }}
            - name: AUTH_MAX_FAILURES
              value: {{ .Values.dashboard.maxFailures | quote }}
            - name: AUTH_WINDOW_SECONDS
              value: {{ .Values.dashboard.windowSeconds | quote }}
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: {{ .Values.pod.targetPort | quote }}
            - name: AWS_REGION
              value: {{ .Values.app.awsRegion | quote }}
            - name: AWS_CACHE_TTL
              value: {{ .Values.app.cacheTtl | quote }}
            - name: AWS_REFRESH_TIMEOUT
              value: {{ .Values.app.refreshTimeout | quote }}
            - name: AWS_FAILURE_COOLDOWN
              value: {{ .Values.app.failureCooldown | quote }}
            - name: AWS_TASK_TIMEOUT
              value: {{ .Values.app.taskTimeout | quote }}
            - name: AWS_MAX_DATA_AGE
              value: {{ .Values.app.maxDataAge | quote }}
            - name: WEB_CONCURRENCY
              value: {{ .Values.app.workers | quote }}
            - name: GUNICORN_THREADS
              value: {{ .Values.app.threads | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.awsSecretName }}
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.awsSecretName }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.awsSecretName }}
                  key: AWS_SESSION_TOKEN
                  optional: true

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
              ephemeral-storage: {{ .Values.resources.requests.ephemeralStorage | quote }}

            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
              ephemeral-storage: {{ .Values.resources.limits.ephemeralStorage | quote }}
