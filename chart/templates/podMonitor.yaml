{{- if .Values.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}-{{ .Values.podMonitor.env | default .Release.Namespace }}-pm
  namespace: {{ .Values.podMonitor.namespace | quote }}
  labels:
    {{- with .Values.podMonitor.release }}
    release: {{ . | quote }}
    {{- end }}
    {{- include "exam.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}

  namespaceSelector:
    matchNames:
      - {{ .Values.podMonitor.env | default .Release.Namespace | quote }}

  podMetricsEndpoints:
    - port: http
      path: {{ .Values.podMonitor.path | quote }}
      interval: {{ .Values.podMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.podMonitor.scrapeTimeout | quote }}
{{- end }}
