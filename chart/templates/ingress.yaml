{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress is enabled" .Values.ingress.host }}
{{- $tlsSecret := required "ingress.tlsSecretName is required when ingress is enabled" .Values.ingress.tlsSecretName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "exam.labels" . | nindent 4 }}
  annotations:
    {{- $annotations := deepCopy .Values.ingress.annotations }}
    {{- $_ := set $annotations "nginx.ingress.kubernetes.io/ssl-redirect" "true" }}
    {{- $_ := set $annotations "nginx.ingress.kubernetes.io/force-ssl-redirect" "true" }}
    {{- toYaml $annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $tlsSecret | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ .Release.Name }}-svc
                port:
                  number: {{ .Values.pod.port }}
{{- end }}
