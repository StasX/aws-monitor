{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-aws
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.awsSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.externalSecret.awsSecretManagerName | quote }}
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecret.awsSecretManagerName | quote }}
        property: AWS_SECRET_ACCESS_KEY
    {{- if .Values.externalSecret.includeSessionToken }}
    - secretKey: AWS_SESSION_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.awsSecretManagerName | quote }}
        property: AWS_SESSION_TOKEN
    {{- end }}
{{- end }}
