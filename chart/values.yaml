replicas: 2

ingress:
  enabled: false
  host: ""
  tlsSecretName: ""
  path: /
  pathType: Prefix
  className: nginx
  annotations: {}

dashboard:
  existingSecret: aws-monitor-dashboard

pod:
  image: sm1986/aws-monitor
  tag: latest
  targetPort: 5001
  port: 80

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

awsSecretName: aws-monitor-secret

externalSecret:
  enabled: false
  secretStoreName: aws-secret-store
  region: us-east-1
  awsSecretManagerName: aws-monitor

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
    ephemeralStorage: "100Mi"

  limits:
    cpu: "500m"
    memory: "512Mi"
    ephemeralStorage: "1Gi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  avgCPUUtilization: 50
  avgMemoryUtilization: 50

networkPolicy:
  enabled: true

pdb:
  maxUnavailable: 1

podMonitor:
  namespace: monitoring
  enabled: false
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s

serviceMonitor:
  namespace: monitoring
  enabled: false
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s
