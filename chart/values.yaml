replicas: 2

app:
  awsRegion: us-east-1
  cacheTtl: 30
  refreshTimeout: 3
  failureCooldown: 10
  taskTimeout: 15
  maxDataAge: 900
  workers: 2
  threads: 4

ingress:
  enabled: true
  host: "localhost"
  tls:
    enabled: false
  # Setting a secret also enables TLS for existing environment values.
  tlsSecretName: ""
  path: /
  pathType: Prefix
  className: nginx
  annotations: {}

dashboard:
  # Only the ingress/proxy source networks that append or overwrite X-Forwarded-For.
  trustedProxyCidrs: []
  maxFailures: 5
  windowSeconds: 60

mongodb:
  existingSecret: aws-monitor-mongodb
  database: aws_monitor

pod:
  image: sm1986/aws-monitor
  tag: ""
  # Required for deployments. Obtain from the pushed image's registry digest.
  digest: ""
  targetPort: 5001
  port: 80

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

awsSecretName: aws-monitor-secret

externalSecret:
  enabled: false
  includeSessionToken: false
  secretStoreName: aws-secret-store
  region: us-east-1
  awsSecretManagerName: aws-monitor

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
    ephemeralStorage: "100Mi"

  limits:
    cpu: "500m"
    memory: "512Mi"
    ephemeralStorage: "1Gi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  avgCPUUtilization: 50
  avgMemoryUtilization: 50

networkPolicy:
  enabled: true

pdb:
  maxUnavailable: 1

podMonitor:
  namespace: monitoring
  enabled: false
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s

serviceMonitor:
  namespace: monitoring
  enabled: false
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s
